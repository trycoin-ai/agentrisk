version: 2

updates:
  # Grouped so a quiet week produces one reviewable PR rather than five.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # The ceiling on mcp is deliberate, not staleness: a new major of the SDK
      # has broken the server before (2.0 removed mcp.server.fastmcp), so raising
      # it is a review against the new API, not a version bump. A weekly pull
      # request offering to widen the range is noise. The advisory canary in
      # ci.yml is what reports when the newer SDK becomes viable.
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        patterns:
          - "pytest*"
          - "hypothesis"
          - "ruff"
          - "mypy"
          - "types-*"
      runtime-dependencies:
        patterns:
          - "pydantic*"
          - "pyyaml"
          - "mcp"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
